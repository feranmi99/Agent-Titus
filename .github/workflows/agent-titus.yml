name: Agent Titus Scheduled Poll

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run single Agent Titus cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python main.py --once

      - name: Persist deduplication cache
        run: |
          if [ -f data/seen_items.json ]; then
            git config user.name "agent-titus[bot]"
            git config user.email "agent-titus[bot]@users.noreply.github.com"
            git add -f data/seen_items.json
            git diff --staged --quiet || git commit -m "chore(state): update seen_items.json [skip ci]"
            git push
          fi

